name: Tests

on:
  pull_request:
  push:
    branches: [main, master]
  # Run the whole suite, live tests included, on any branch from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Pull requests run the offline tests only: the live tests depend on the public
      # DBpedia endpoint, which is often slow or down and then fails every PR. Pushes to
      # main/master (which gate the deployment) and manual runs still run everything.
      - name: Run test suite
        env:
          MARKERS: ${{ github.event_name == 'pull_request' && 'not live' || '' }}
        run: pytest tests/ -m "$MARKERS"

      - name: Upload test records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-records
          path: tests/records/
