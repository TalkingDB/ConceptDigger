name: Deployment

on:
  push:
    branches:
      - master
      - develop

# prevent concurrent deployments on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # master branch deployment (production)
  # -------------------------------------------------------------
  deploy-master:
    name: Deploy to Production
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Run master deployment script on VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          # Pass runner environment variables securely into the remote shell session
          ssh -o StrictHostKeyChecking=accept-new "$VM_USER@$VM_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' TARGET_BRANCH='master' bash -s" << 'EOF'
            set -e
            echo "[MASTER] Navigating to repository directory..."
            cd "$DEPLOY_DIR"

            echo "[MASTER] Pulling latest changes..."
            git checkout master
            git pull origin master

            echo "[MASTER] Running deployment script..."
            sudo bash deploy.sh
          EOF

