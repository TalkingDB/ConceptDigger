[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-digger"
version = "0.1.0"
description = "Digs DBpedia categories into a cached graph of pages, synonyms and Wikipedia abstracts."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENCE-AGPL-3.0.txt"]
# What the package needs to be imported as a library (concept_digger.dig, .graph_store, ...);
# the HTTP service adds the `server` extra.
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "networkx>=3.3,<4.0",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.30,<1.0"]

[tool.setuptools.packages.find]
include = ["concept_digger*"]
